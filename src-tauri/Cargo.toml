[package]
name = "real-estate-tracker"
version = "1.5.0"
description = "Local-first macOS app for tracking a rental-apartment portfolio with 30-year projections"
authors = ["Vlastimil Bureš"]
license = "MIT"
repository = "https://github.com/vlastimilbures/real-estate-tracker"
publish = false
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
# The app ships on macOS only (#473). `rlib` is what `src/main.rs` and tests/*.rs link
# against; the template's `staticlib` and `cdylib` exist for the iOS and Android builds.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
# D-64 (DR-142, UX-065): restores window size/position; Rust-only, no webview permission.
tauri-plugin-window-state = "2"
# D-14 (J-13 b): src/db.rs runs atomic transactions on tauri-plugin-sql's own pool. The same
# sqlx 0.8.6 the plugin already compiles in; declared directly to name its types.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

# ADR 0196 (RUSTSEC-2026-0459): sqlx-sqlite 0.8.6 pins libsqlite3-sys 0.30.1 (SQLite 3.46).
# The vendored copy is the crates.io source with one change, the libsqlite3-sys bound widened
# to `>=0.30.1, <0.40.0` as upstream did in launchbadge/sqlx#4502; Cargo.lock then takes
# libsqlite3-sys 0.39.1 (SQLite 3.54.1). scripts/check-vendored-sqlx-sqlite.sh guards the
# diff. Remove both once tauri-plugin-sql ships on a sqlx that allows libsqlite3-sys >=0.39.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }

# Dev-only: async test runtime for tests/*.rs (H-14 proof, db.rs behaviour).
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# tests/menu_built.rs builds the real menu on tauri's mock runtime (no app, no window) and
# reads it back from AppKit. The same tauri and objc2 versions the app already compiles.
tauri = { version = "2.11.2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSImage"] }

# AppKit makes menus on the process's main thread only, which a libtest worker is not:
# this binary runs its own main().
[[test]]
name = "menu_built"
harness = false

# Build scripts and proc-macros only (the app binary is unaffected): release builds strip
# their debug info by default, and macOS 27's loader rejects the stripped proc-macro
# dylibs ("mis-aligned LINKEDIT string pool"), so `tauri build` fails (P8).
[profile.release.build-override]
strip = "none"
