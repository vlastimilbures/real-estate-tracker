[package]
name = "real-estate-tracker"
version = "1.4.0"
description = "Local-first macOS app for tracking a rental-apartment portfolio with 30-year projections"
authors = ["Vlastimil Bureš"]
license = "MIT"
repository = "https://github.com/vlastimilbures/real-estate-tracker"
publish = false
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
# D-64 (DR-142, UX-065): restores window size/position; Rust-only, no webview permission.
tauri-plugin-window-state = "2"
# D-14 (J-13 b): src/db.rs runs atomic transactions on tauri-plugin-sql's own pool. The same
# sqlx 0.8.6 the plugin already compiles in; declared directly to name its types.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

# Dev-only: async test runtime for tests/*.rs (H-14 proof, db.rs behaviour).
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Build scripts and proc-macros only (the app binary is unaffected): release builds strip
# their debug info by default, and macOS 27's loader rejects the stripped proc-macro
# dylibs ("mis-aligned LINKEDIT string pool"), so `tauri build` fails (P8).
[profile.release.build-override]
strip = "none"
