verifyDepsBeforeRun: false
# The only dependencies whose install scripts run (pnpm 11's build allow-list).
allowBuilds:
  better-sqlite3: true
  esbuild: true
# Security floors for transitive dependencies, each at or past the first patched release.
# Drop an override when `pnpm why <package>` shows that every dependant's own range
# resolves at or above its floor.
overrides:
  # ADR 0015, under exceljs. The ADR minimum 1.1.18 is the fix for
  # GHSA-rgw5-rvv9-x895; the floor 1.1.21 is the fix for GHSA-q2hr-2g5m-vwhr. Also covers
  # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7.
  brace-expansion@1: ^1.1.21
  # ADR 0015, under exceljs. The ADR minimum 2.1.4 is the fix for GHSA-rgw5-rvv9-x895; the
  # floor 2.1.7 is the fix for GHSA-q2hr-2g5m-vwhr (the same advisories as @1).
  brace-expansion@2: ^2.1.7
  # ADR 0015, under exceljs; ships in the bundle, approved under ADR 0002. The advisory is not
  # recorded.
  uuid@<11.1.1: ^11.1.1
  # Dev toolchain (2026-10, commit 97eb4fb2) from here on.
  # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895, GHSA-6j4f-fj2g-mc7p,
  # GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr.
  brace-expansion@5: ^5.0.12
  # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh. Inert: the lockfile
  # resolves js-yaml 5.5.0 only.
  js-yaml@4: ^4.3.2
  # GHSA-73wf-gq98-2v4g, GHSA-c83g-rgw3-j3cx.
  browserslist: ^4.28.7
  # GHSA-w5vr-8v7q-w6rv.
  baseline-browser-mapping: ^2.11.0
  # GHSA-r28c-9q8g-f849, GHSA-fxqj-rqcc-2cmp.
  postcss: ^8.5.23
  # GHSA-q8mj-m7cp-5q26. GHSA-4mjr-xmp4-gh2g and GHSA-x5fp-wj9c-mxmx need 6.16.0; the
  # lockfile resolves 6.17.1.
  qs@6: ^6.15.2
  # GHSA-g3hv-75wg-m249 (Dependabot alert 47), under @stryker-mutator/core, which pins
  # minimatch ~10.2.4 in its latest release 10.1.1. The patched line is 11.0.1; the
  # other minimatch 3, 5 and 10 consumers stay on their own ranges.
  "@stryker-mutator/core>minimatch": ^11.0.1
