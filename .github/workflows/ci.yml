name: CI

# Scope push to main only — a PR branch push already triggers the pull_request event,
# so without this filter every PR commit would run CI twice.
on:
  push:
    branches: [main]
  # ready_for_review: a draft PR runs no checks (every job below is skipped), so a session
  # can push review fixes, an ADR renumber and a main merge for free, then mark the PR ready
  # for one full run (CONTRIBUTING.md, "Pull requests").
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege: workflows only need to read the repo.
permissions:
  contents: read

# Cancel any in-progress CI run for the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend: TypeScript, lint, formatting, unit tests ────────────────────
  # Two parallel jobs; the required check "Frontend (…)" below passes only if both pass.
  # The aggregates run unless the run is cancelled: a skipped required check would count as
  # passed, so a failed job must fail them, not skip them.
  frontend-checks:
    name: Frontend checks and coverage
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm, Node and dependencies
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm exec prettier --check .

      # Layer map (ADR 0072). The known-violations baseline is empty and may only shrink.
      - name: Architecture rules
        run: pnpm depcruise

      # Both baselines may only shrink: layer violations and function sizes (#456).
      - name: Baseline never grows
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          pnpm depcruise:baseline-check
          pnpm lint:size:baseline-check

      - name: Dead code
        run: pnpm knip

      # The shipped app only: an export only tests use is dead too (#145). A deliberate
      # test seam carries an `@internal` JSDoc tag saying who uses it.
      - name: Dead code (production)
        run: pnpm knip:prod

      # Generated index and paired Amends / Supersedes links (ADR 0152).
      - name: ADR index and links
        run: pnpm adr:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Full suite, parity tests included, + per-folder coverage ratchet (floors in
      # coverage-floors.json).
      - name: Test with coverage thresholds
        run: pnpm test:coverage

      # A floor more than MAX_SLACK points below measured must be raised
      # (scripts/check-coverage-ratchet.mjs, #141).
      - name: Coverage floors keep up
        run: pnpm coverage:ratchet

      # Only the production build exercises Rolldown chunking, `?url` asset imports and the
      # dead-code elimination that keeps the E2E-only sql.js (src/data/browserSql.ts) out of
      # the app bundle; otherwise a break shows up only at release time (#161).
      - name: Production build
        run: pnpm exec vite build

      # grep exits 1 for no match; 0 (a match) and 2 (no dist/assets, a read error) fail.
      - name: sql.js stays out of the bundle
        run: |
          status=0
          grep -rlE 'sql-wasm|initSqlJs' dist/assets || status=$?
          if [[ $status == 0 ]]; then
            echo "::error::sql.js reached dist/assets; src/data/browserSql.ts is for E2E only"
          fi
          [[ $status == 1 ]]

  frontend-time-zones:
    name: Frontend tests in other time zones
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm, Node and dependencies
        uses: ./.github/actions/setup

      # Dates are UTC by convention; a non-UTC zone (UTC−11) catches local-time leaks.
      - name: Tests (non-UTC time zone)
        run: pnpm test
        env:
          TZ: Pacific/Pago_Pago

      # A local-versus-UTC day mix-up shows only on the side of midnight where the two days
      # differ, which depends on the offset's sign: a positive zone (UTC+14) for the layers
      # that read local time. The engine never does, and runs in UTC above (#119, ADR 0149).
      - name: Tests (positive time zone, UI layers)
        run: pnpm vitest run src/lib src/ui src/state
        env:
          TZ: Pacific/Kiritimati

  frontend:
    name: Frontend (typecheck · lint · format · test)
    needs: [frontend-checks, frontend-time-zones]
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: The frontend jobs passed
        run: |
          [[ "${{ needs.frontend-checks.result }}" == success ]]
          [[ "${{ needs.frontend-time-zones.result }}" == success ]]

  # ── UI captures and axe: every captured screen (F-08, ADR 0078, ADR 0158) ──
  # Runs the ux:capture harness on the in-memory sample portfolio (no real data) and fails
  # on any axe WCAG 2.2 AA violation, or on a layout screen in Czech or Russian with a
  # string clipped or covered. Screenshots are a by-product.
  # Split into 4 parallel shards (one shard on 2 workers took 20 min); the required check
  # "UI captures and axe" below (ADR 0249) passes only if every shard passes.
  axe-shard:
    name: Axe shard ${{ matrix.shard }}/4
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm, Node and dependencies
        uses: ./.github/actions/setup

      # The browser is cached by Playwright version (#496): a hit skips the download and
      # installs only the system libraries, which live outside the cache.
      - name: Read the Playwright version
        id: playwright
        # `playwright --version` prints "Version 1.2.3".
        run: |
          version=$(pnpm exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # English, light + dark, default and minimum window (owner, ADR 0078).
      - name: Capture screens with axe scans
        run: pnpm ux:capture --shard ${{ matrix.shard }}/4
        env:
          UX_RUN_ID: ci
          UX_LANG: en
          UX_THEME: both
          UX_VIEWPORT: 1280x800,min

      - name: Fail on any axe violation
        run: pnpm ux:axe-check ci

      # The layout screens in Czech and Russian: their strings are longer, and the screens
      # assert nothing is clipped or covered (ADR 0158). They carry the @layout-i18n tag
      # (ux-capture/layoutScreens.ts); a renamed one fails the run (#496).
      - name: Capture layout screens in Czech and Russian
        run: pnpm ux:capture --shard ${{ matrix.shard }}/4 --grep @layout-i18n
        env:
          UX_RUN_ID: ci-i18n
          UX_LANG: cs,ru
          UX_THEME: light
          # 1200 × 800 is the app's default window (tauri.conf.json, ADR 0200 §4).
          UX_VIEWPORT: 1280x800,1200x800,min

      - name: Fail on any axe violation in Czech and Russian
        run: pnpm ux:axe-check ci-i18n

      # The whole run: screenshots, axe JSON, summary.md and the Playwright traces of
      # failed captures, which live in the hidden ux-screens/ci/.playwright folder (#137).
      # Also on a green run with a capture that passed only on its retry (flaky.json, #496).
      - name: Upload capture evidence
        if: failure() || hashFiles('ux-screens/*/flaky.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-capture-ci-${{ matrix.shard }}
          path: |
            ux-screens/ci/
            ux-screens/ci-i18n/
          include-hidden-files: true
          retention-days: 14

  axe:
    name: UI captures and axe
    needs: axe-shard
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Every axe shard passed
        run: '[[ "${{ needs.axe-shard.result }}" == success ]]'

  # ── Rust / Tauri shell: formatting, clippy, tests, build ──────────────────
  rust:
    name: Rust (fmt · clippy · test · audit · build)
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri on Linux needs GTK / WebKit system libraries.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      # Installs the pinned toolchain and components from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      # Cache ~/.cargo/registry + the target dir keyed to Cargo.lock.
      - name: Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Formatting check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Integration tests (DB transactions, migrations, H-14 probe). The timing-dependent
      # H-14 probe is #[ignore]d (DR-169); run it locally with `cargo test -- --ignored`.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # ADR 0196: Cargo.lock uses the vendored sqlx-sqlite, which is crates.io 0.8.6 plus
      # one Cargo.toml line.
      - name: Vendored sqlx-sqlite patch
        run: bash scripts/check-vendored-sqlx-sqlite.sh

      # Ignores (lock-only crates) are documented in src-tauri/.cargo/audit.toml.
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

      - name: Build
        run: cargo build --manifest-path src-tauri/Cargo.toml
