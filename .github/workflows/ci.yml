name: CI

# Scope push to main only — a PR branch push already triggers the pull_request event,
# so without this filter every PR commit would run CI twice.
on:
  push:
    branches: [main]
  # ready_for_review: a draft PR runs no checks (every job below is skipped), so a session
  # can push review fixes, an ADR renumber and a main merge for free, then mark the PR ready
  # for one full run (CONTRIBUTING.md, "Pull requests").
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege: workflows only need to read the repo.
permissions:
  contents: read

# Cancel any in-progress CI run for the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Changes: full checks, or the docs fast path (scripts/ci-changes.sh) ──
  # A skipped job counts as passed for a required check, so the heavy jobs below run unless
  # this job positively says `code=false`; if it fails, they run in full.
  changes:
    name: Changes
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The base branch's copy decides, so a pull request cannot rewrite its own gate. A push
      # to main, or a base without the script yet, gets the full checks.
      - id: diff
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          if ! git show FETCH_HEAD:scripts/ci-changes.sh >"$RUNNER_TEMP/ci-changes.sh"; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          bash "$RUNNER_TEMP/ci-changes.sh"
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # ── Docs fast path: what a documentation-only change can break ───────────
  docs:
    name: Docs (format · ADR index)
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm exec prettier --check .

      - name: ADR index and links
        run: pnpm adr:check

      # The tests that read documentation: the CSV guide's examples and the real docs/adr.
      - name: Tests that read docs
        run: pnpm vitest run src/import/__tests__/csvGuide.test.ts scripts/__tests__/adr-index.test.mjs

  # ── Frontend: TypeScript, lint, formatting, unit tests ────────────────────
  # Two parallel jobs; the required check "Frontend (…)" below passes only if both pass, or,
  # on the docs fast path, only if the docs job passes (it is not a required check itself).
  frontend-checks:
    name: Frontend checks and coverage
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.code != 'false' &&
      (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from package.json "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm exec prettier --check .

      # Layer map (ADR 0072). The known-violations baseline is empty and may only shrink.
      - name: Architecture rules
        run: pnpm depcruise

      - name: Baseline never grows
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          pnpm depcruise:baseline-check

      - name: Dead code
        run: pnpm knip

      # Generated index and paired Amends / Supersedes links (ADR 0152).
      - name: ADR index and links
        run: pnpm adr:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Separately named so a parity break (engine vs its parity targets) is visible at a glance.
      - name: Parity tests
        run: pnpm test:parity

      # Full suite + per-folder coverage ratchet (thresholds in vite.config.ts).
      - name: Test with coverage thresholds
        run: pnpm test:coverage

      # Only the production build exercises Rolldown chunking, `?url` asset imports and the
      # dead-code elimination that keeps the E2E-only sql.js (src/data/browserSql.ts) out of
      # the app bundle; otherwise a break shows up only at release time (#161).
      - name: Production build
        run: pnpm exec vite build

      # grep exits 1 for no match; 0 (a match) and 2 (no dist/assets, a read error) fail.
      - name: sql.js stays out of the bundle
        run: |
          status=0
          grep -rlE 'sql-wasm|initSqlJs' dist/assets || status=$?
          if [[ $status == 0 ]]; then
            echo "::error::sql.js reached dist/assets; src/data/browserSql.ts is for E2E only"
          fi
          [[ $status == 1 ]]

  frontend-time-zones:
    name: Frontend tests in other time zones
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.code != 'false' &&
      (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from package.json "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dates are UTC by convention; a non-UTC zone (UTC−11) catches local-time leaks.
      - name: Tests (non-UTC time zone)
        run: pnpm test
        env:
          TZ: Pacific/Pago_Pago

      # A local-versus-UTC day mix-up shows only on the side of midnight where the two days
      # differ, which depends on the offset's sign: a positive zone (UTC+14) for the layers
      # that read local time. The engine never does, and runs in UTC above (#119, ADR 0149).
      - name: Tests (positive time zone, UI layers)
        run: pnpm vitest run src/lib src/ui src/state
        env:
          TZ: Pacific/Kiritimati

  frontend:
    name: Frontend (typecheck · lint · format · test)
    needs: [changes, docs, frontend-checks, frontend-time-zones]
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: The frontend jobs passed
        run: |
          if [[ "${{ needs.changes.outputs.code }}" == false ]]; then
            [[ "${{ needs.docs.result }}" == success ]]
          else
            [[ "${{ needs.frontend-checks.result }}" == success ]]
            [[ "${{ needs.frontend-time-zones.result }}" == success ]]
          fi

  # ── Accessibility: axe scan of every captured screen (F-08, ADR 0078) ────
  # Runs the ux:capture harness on the in-memory sample portfolio (no real data) and fails
  # on any axe WCAG 2.2 AA violation. Screenshots are a by-product; only axe is gated.
  # Split into 4 parallel shards (one shard on 2 workers took 20 min); the required check
  # "Accessibility (axe scan)" below passes only if every shard passes.
  axe-shard:
    name: Axe shard ${{ matrix.shard }}/4
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.code != 'false' &&
      (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from package.json "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # English, light + dark, default and minimum window (owner, ADR 0078).
      - name: Capture screens with axe scans
        run: pnpm ux:capture --shard ${{ matrix.shard }}/4
        env:
          UX_RUN_ID: ci
          UX_LANG: en
          UX_THEME: both
          UX_VIEWPORT: 1280x800,min

      - name: Fail on any axe violation
        run: pnpm ux:axe-check ci

      # The layout screens in Czech and Russian: their strings are longer, and the screens
      # assert nothing is clipped or covered (ADR 0158).
      - name: Capture layout screens in Czech and Russian
        run: pnpm ux:capture --shard ${{ matrix.shard }}/4 --grep "01-dashboard|14-properties-long-name|20-property-detail|27-property-section-nav-focus|42-scenarios-compare"
        env:
          UX_RUN_ID: ci-i18n
          UX_LANG: cs,ru
          UX_THEME: light
          UX_VIEWPORT: 1280x800,min

      - name: Fail on any axe violation in Czech and Russian
        run: pnpm ux:axe-check ci-i18n

      # The whole run: screenshots, axe JSON, summary.md and the Playwright traces of
      # failed captures, which live in the hidden ux-screens/ci/.playwright folder (#137).
      - name: Upload capture evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-capture-ci-${{ matrix.shard }}
          path: |
            ux-screens/ci/
            ux-screens/ci-i18n/
          include-hidden-files: true
          retention-days: 14

  axe:
    name: Accessibility (axe scan)
    needs: [changes, axe-shard]
    if: >-
      !cancelled() && needs.changes.outputs.code != 'false' &&
      (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Every axe shard passed
        run: '[[ "${{ needs.axe-shard.result }}" == success ]]'

  # ── Rust / Tauri shell: formatting, clippy, tests, build ──────────────────
  rust:
    name: Rust (fmt · clippy · test · audit · build)
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.code != 'false' &&
      (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri on Linux needs GTK / WebKit system libraries.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      # Installs the pinned toolchain and components from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain

      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit

      # Cache ~/.cargo/registry + the target dir keyed to Cargo.lock.
      - name: Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Formatting check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Integration tests (DB transactions, migrations, H-14 probe). The timing-dependent
      # H-14 probe is #[ignore]d (DR-169); run it locally with `cargo test -- --ignored`.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Ignores (lock-only crates) are documented in src-tauri/.cargo/audit.toml.
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

      - name: Build
        run: cargo build --manifest-path src-tauri/Cargo.toml
