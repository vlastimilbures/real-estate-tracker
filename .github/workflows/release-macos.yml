name: Release (macOS)

# The ad-hoc-signed Apple Silicon bundle (scripts/release-macos.sh). Runs on `v*` tags and
# on manual dispatch. On a tag it attaches the dmg to that tag's GitHub release, creating
# the release if it does not exist yet. The script skips its checks here, and CI does not
# run on tags: a tag must name the package.json version and a commit on `main` (checked
# below), and the release checklist tags only a commit whose CI on `main` passed and that
# the owner built with the full local script (docs/release.md, steps 6 and 8).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle · ad-hoc sign · verify
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      # Full history, so the tag can be checked against origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Fail before building: tag v1.4.1 with package.json still at 1.4.0 would publish a
      # 1.4.0 dmg under the 1.4.1 release.
      - name: The tag names the version and a commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain

      - name: Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Builds aarch64-apple-darwin, then checks: codesign --verify, ad-hoc signature,
      # hardened runtime, arm64 only, LSMinimumSystemVersion 13.0.
      - name: Build and verify the bundle
        run: scripts/release-macos.sh --skip-checks

      - name: Upload the app and dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-estate-tracker-${{ github.ref_name }}-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30

      - name: Attach the dmg to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Never replaces a published dmg: ad-hoc builds are not reproducible, so a new one
        # would no longer match the SHA-256 printed for the first. To rebuild, delete the
        # asset from the release by hand, then re-run.
        run: |
          version=$(node -p "require('./package.json').version")
          dmg="Real Estate Tracker_${version}_aarch64.dmg"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qxF "$dmg"; then
            echo "::error::release $GITHUB_REF_NAME already has $dmg; delete it first to replace it"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/$dmg"
