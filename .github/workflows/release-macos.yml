name: Release (macOS)

# The ad-hoc-signed Apple Silicon bundle (scripts/release-macos.sh). Runs on `v*` tags and
# on manual dispatch. On a tag it attaches the dmg to that tag's GitHub release, creating
# the release if it does not exist yet. Lint, tests, fmt, clippy and audits already ran in
# CI, so the script skips them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle · ad-hoc sign · verify
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show active-toolchain

      - name: Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Builds aarch64-apple-darwin, then checks: codesign --verify, ad-hoc signature,
      # hardened runtime, arm64 only, LSMinimumSystemVersion 13.0.
      - name: Build and verify the bundle
        run: scripts/release-macos.sh --skip-checks

      - name: Upload the app and dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-estate-tracker-${{ github.ref_name }}-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30

      - name: Attach the dmg to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg --clobber
