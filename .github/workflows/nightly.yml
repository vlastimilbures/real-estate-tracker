name: Nightly (mutation testing, bench budgets, property runs)

# Stryker on src/engine (J-09 → D-26, D-68), sharded (ADR 0239): seven matrix legs each
# mutate part of the engine (scripts/mutation-shards.mjs) and report their own score; the
# mutation-score job merges them and fails when the combined score drops below
# thresholds.break in stryker.config.json, or a leg's report is missing. The bench job fails
# when a budgeted engine bench's p99 exceeds 2 × its budget, or the recast build outgrows the
# plain build in the same run (ADR 0066, ADR 0073, ADR 0172). Scheduled runs of these skip
# when main has no commit in the last 24 h; a manual run always runs them.
#
# The property job runs the whole test suite with every fast-check property test at 2000
# runs every night, quiet days included: the seed, not the code, is what changes (#232,
# #167, #443). The seed is the run's UTC creation date (YYYYMMDD), so "Re-run failed jobs"
# replays it.
#
# A run with a failed, timed-out or cancelled job opens one issue labelled
# `nightly-failure`, or comments on the open one, with the run, each job's result and, when
# the property job failed or timed out, the seed and the reproduce line (#443). Close the
# issue once the cause is fixed; the next failure opens a new one.
#
# Stryker runs incrementally (ADR 0151, ADR 0239): each leg restores its own previous result
# file from the Actions cache, so only mutants in changed engine code or tests rerun. A leg
# with no cache tests all its mutants; a cold run of the whole engine (~6 h in one job, run
# 43834527278) takes 32-110 min per leg once sharded (run 43924585493), under the
# 180-minute leg timeout. A manual run with
# `mutation_cold` skips the restore. Caches made on main are visible to every branch.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fc_seed:
        description: "fast-check seed for the property job, up to 9 digits (default: the run's date, YYYYMMDD)"
        required: false
        default: ""
      mutation_cold:
        description: "Stryker: skip the incremental cache restore and test every mutant"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  changed:
    name: Main changed in 24 h?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 50

      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$(git log --since='24 hours ago' --format=%H -1)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit on main in 24 h: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: Stryker (${{ matrix.shard }})
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Cold legs took 32-110 min (run 43924585493, ADR 0239); this is the hard stop, with
    # headroom for the slowest legs and still under GitHub's 360-minute job limit.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # The shard names of scripts/mutation-shards.mjs; its merge fails on a missing one.
      matrix:
        shard:
          - schedule-a
          - schedule-b
          - validate-a
          - validate-b
          - projections
          - kpis
          - rest
    env:
      STRYKER_SHARD: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm, Node and dependencies
        uses: ./.github/actions/setup

      - name: Restore the incremental mutation result
        if: ${{ !inputs.mutation_cold }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/stryker-incremental-${{ matrix.shard }}.json
          key: stryker-incremental-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: stryker-incremental-${{ matrix.shard }}-

      # No break here: the mutation-score job gates the combined score (ADR 0239).
      - name: Mutation testing
        run: pnpm mutation:shard --concurrency 4

      - name: Report the shard's mutation score
        if: always() && hashFiles('reports/mutation/mutation.json') != ''
        run: |
          set -o pipefail
          node scripts/mutation-shards.mjs score reports/mutation/mutation.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Saved even when the run fails, so the next run does not redo the whole leg;
      # skipped when there is no result file at all.
      - name: Save the incremental mutation result
        if: always() && hashFiles(format('reports/mutation/stryker-incremental-{0}.json', matrix.shard)) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/stryker-incremental-${{ matrix.shard }}.json
          key: stryker-incremental-${{ matrix.shard }}-${{ github.run_id }}

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
          retention-days: 30

  mutation-score:
    name: Mutation score (combined)
    needs: [changed, mutation]
    # Runs after every leg, failed, timed out or cancelled too: a missing leg report fails
    # it, so `report` sees the failure (ADR 0239).
    if: always() && needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-report-*
          path: reports/shards

      # Fails below thresholds.break in stryker.config.json, on a missing leg, on a mutant
      # two legs report and on a split file with a part missing.
      - name: Merge the shards and check the combined score
        run: |
          set -o pipefail
          node scripts/mutation-shards.mjs merge reports/shards | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the merged mutation report
        if: always() && hashFiles('reports/mutation/mutation.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          retention-days: 30

  bench:
    name: Engine bench budgets
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm, Node and dependencies
        uses: ./.github/actions/setup

      - name: Bench
        run: pnpm bench --outputJson bench.json

      - name: Check p99 against 2 × budget and the same-run ratio
        run: pnpm bench:check bench.json

      - name: Upload the bench report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: bench.json
          retention-days: 30

  properties:
    name: Property tests (2000 runs)
    runs-on: ubuntu-latest
    # The whole suite at 2000 runs takes a few minutes (slowest property test ~30 s).
    # Vitest cannot interrupt a synchronous fc.assert, so this bounds a long shrink or a
    # hang; the seed is printed before the tests start, and again as an error annotation
    # when they fail.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # the run's creation date, for the seed
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
      repro: ${{ steps.seed.outputs.repro }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm, Node and dependencies
        uses: ./.github/actions/setup

      - name: Pick the seed
        id: seed
        env:
          INPUT_SEED: ${{ inputs.fc_seed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          seed="$INPUT_SEED"
          if [[ -z "$seed" ]]; then
            created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at) ||
              created=$(date -u +%Y-%m-%d)
            seed="${created:0:4}${created:5:2}${created:8:2}"
          fi
          if [[ ! "$seed" =~ ^[0-9]{1,9}$ ]]; then
            echo "fc_seed must be 1-9 digits, got '$seed'" >&2
            exit 1
          fi
          repro="FC_SEED=$seed FC_RUNS=2000 pnpm exec vitest run"
          {
            echo "FC_SEED=$seed"
            echo "REPRO=$repro"
          } >> "$GITHUB_ENV"
          {
            echo "seed=$seed"
            echo "repro=$repro"
          } >> "$GITHUB_OUTPUT"
          echo "Seed $seed. Reproduce locally: $repro"
          {
            echo "### Property tests"
            echo "Seed \`$seed\`, 2000 runs. Reproduce locally:"
            echo '```sh'
            echo "$repro"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The whole suite, not a file list: a new property file needs no workflow change.
      - name: Property tests
        env:
          FC_RUNS: "2000"
        run: pnpm exec vitest run

      - name: Print the seed on failure
        # Only once a seed was picked: a failed install has no seed to report.
        if: failure() && env.FC_SEED != ''
        run: |
          echo "::error title=Property tests failed::Seed $FC_SEED. Reproduce locally: $REPRO"

  report:
    name: Report a failure
    needs: [changed, mutation, mutation-score, bench, properties]
    # Any failed job, or one that hit its timeout-minutes (it ends `cancelled`), scheduled
    # or dispatched on any branch. A manual cancel reports too.
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One report at a time, so two failing runs cannot both open an issue.
    concurrency:
      group: nightly-report
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          CHANGED: ${{ needs.changed.result }}
          MUTATION: ${{ needs.mutation.result }}
          MUTATION_SCORE: ${{ needs.mutation-score.result }}
          BENCH: ${{ needs.bench.result }}
          PROPERTIES: ${{ needs.properties.result }}
          SEED: ${{ needs.properties.outputs.seed }}
          REPRO: ${{ needs.properties.outputs.repro }}
        run: |
          label=nightly-failure
          gh label create "$label" --color B60205 \
            --description "A nightly run failed (nightly.yml)" 2>/dev/null || true
          title="Nightly run failed"
          if [[ "$REF" != main ]]; then title="$title (branch $REF)"; fi
          # A job that hits timeout-minutes ends `cancelled`, like a manual cancel.
          result() { if [[ "$1" == cancelled ]]; then echo "timed out or cancelled"; else echo "$1"; fi; }
          {
            echo "$title: $RUN_URL"
            echo
            echo "Trigger \`$EVENT\` on \`$REF\` @ \`${SHA:0:8}\`."
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Main changed in 24 h? | $(result "$CHANGED") |"
            echo "| Stryker (all legs) | $(result "$MUTATION") |"
            echo "| Mutation score (combined) | $(result "$MUTATION_SCORE") |"
            echo "| Engine bench budgets | $(result "$BENCH") |"
            echo "| Property tests (2000 runs) | $(result "$PROPERTIES") |"
            if [[ "$PROPERTIES" == failure || "$PROPERTIES" == cancelled ]]; then
              echo
              if [[ -n "$SEED" ]]; then
                echo "Property seed \`$SEED\`. Reproduce locally:"
                echo
                echo '```sh'
                echo "$REPRO"
                echo '```'
              else
                echo "No property seed was picked (the job failed before it)."
              fi
            fi
          } > body.md
          num=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [[ -n "$num" ]]; then
            gh issue comment "$num" --body-file body.md
          else
            gh issue create --title "$title" --label "$label" --body-file body.md
          fi
