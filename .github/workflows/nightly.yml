name: Nightly (mutation testing, bench budgets, property runs)

# Stryker on src/engine (J-09 → D-26, D-68). The run fails when the mutation score drops
# below thresholds.break in stryker.config.json. The bench job fails when a budgeted
# engine bench's p99 exceeds 2 × its budget, or the recast build outgrows the plain build
# in the same run (ADR 0066, ADR 0073, ADR 0172). Scheduled runs of these two skip when
# main has no commit in the last 24 h; a manual run always runs both.
#
# The property job runs the whole test suite with every fast-check property test at 2000
# runs every night, quiet days included: the seed, not the code, is what changes (#232,
# #167, #443). The seed is the run's UTC creation date (YYYYMMDD), so "Re-run failed jobs"
# replays it.
#
# A run with a failed, timed-out or cancelled job opens one issue labelled
# `nightly-failure`, or comments on the open one, with the run, each job's result and, when
# the property job failed or timed out, the seed and the reproduce line (#443). Close the
# issue once the cause is fixed; the next failure opens a new one.
#
# Stryker runs incrementally (ADR 0151): the previous run's result file is restored from the
# Actions cache, so only mutants in changed engine code or tests rerun. The first run on a
# branch has no cache and tests every mutant: ~6 h on a 4-vCPU runner (run 43834527278),
# past the 300-minute job timeout, pending AC3 of #443. Later runs take minutes. Caches made
# on main are visible to every branch.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fc_seed:
        description: "fast-check seed for the property job, up to 9 digits (default: the run's date, YYYYMMDD)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  changed:
    name: Main changed in 24 h?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 50

      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$(git log --since='24 hours ago' --format=%H -1)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit on main in 24 h: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: Stryker (src/engine)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the incremental mutation result
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-

      - name: Mutation testing
        run: pnpm mutation --concurrency 4

      # Stryker's score: detected (killed + timeout) over valid (detected + survived +
      # no coverage) mutants, as `thresholds.break` reads it.
      - name: Report the mutation score
        if: always() && hashFiles('reports/mutation/mutation.json') != ''
        run: |
          node -e '
            const r = require("./reports/mutation/mutation.json");
            const brk = require("./stryker.config.json").thresholds.break;
            let d = 0, u = 0;
            for (const f of Object.values(r.files))
              for (const m of f.mutants) {
                if (m.status === "Killed" || m.status === "Timeout") d++;
                else if (m.status === "Survived" || m.status === "NoCoverage") u++;
              }
            const s = ((100 * d) / (d + u)).toFixed(2);
            console.log(`### Mutation score\n\n${s} % (${d} of ${d + u} mutants detected; break ${brk} %)`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      # Saved even when the score breaks the threshold, so the next run does not redo
      # the whole engine; skipped when there is no result file at all.
      - name: Save the incremental mutation result
        if: always() && hashFiles('reports/mutation/stryker-incremental.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30

  bench:
    name: Engine bench budgets
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bench
        run: pnpm bench --outputJson bench.json

      - name: Check p99 against 2 × budget and the same-run ratio
        run: pnpm bench:check bench.json

      - name: Upload the bench report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: bench.json
          retention-days: 30

  properties:
    name: Property tests (2000 runs)
    runs-on: ubuntu-latest
    # The whole suite at 2000 runs takes a few minutes (slowest property test ~30 s).
    # Vitest cannot interrupt a synchronous fc.assert, so this bounds a long shrink or a
    # hang; the seed is printed before the tests start, and again as an error annotation
    # when they fail.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # the run's creation date, for the seed
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
      repro: ${{ steps.seed.outputs.repro }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pick the seed
        id: seed
        env:
          INPUT_SEED: ${{ inputs.fc_seed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          seed="$INPUT_SEED"
          if [[ -z "$seed" ]]; then
            created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at) ||
              created=$(date -u +%Y-%m-%d)
            seed="${created:0:4}${created:5:2}${created:8:2}"
          fi
          if [[ ! "$seed" =~ ^[0-9]{1,9}$ ]]; then
            echo "fc_seed must be 1-9 digits, got '$seed'" >&2
            exit 1
          fi
          repro="FC_SEED=$seed FC_RUNS=2000 pnpm exec vitest run"
          {
            echo "FC_SEED=$seed"
            echo "REPRO=$repro"
          } >> "$GITHUB_ENV"
          {
            echo "seed=$seed"
            echo "repro=$repro"
          } >> "$GITHUB_OUTPUT"
          echo "Seed $seed. Reproduce locally: $repro"
          {
            echo "### Property tests"
            echo "Seed \`$seed\`, 2000 runs. Reproduce locally:"
            echo '```sh'
            echo "$repro"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The whole suite, not a file list: a new property file needs no workflow change.
      - name: Property tests
        env:
          FC_RUNS: "2000"
        run: pnpm exec vitest run

      - name: Print the seed on failure
        # Only once a seed was picked: a failed install has no seed to report.
        if: failure() && env.FC_SEED != ''
        run: |
          echo "::error title=Property tests failed::Seed $FC_SEED. Reproduce locally: $REPRO"

  report:
    name: Report a failure
    needs: [changed, mutation, bench, properties]
    # Any failed job, or one that hit its timeout-minutes (it ends `cancelled`), scheduled
    # or dispatched on any branch. A manual cancel reports too.
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One report at a time, so two failing runs cannot both open an issue.
    concurrency:
      group: nightly-report
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          CHANGED: ${{ needs.changed.result }}
          MUTATION: ${{ needs.mutation.result }}
          BENCH: ${{ needs.bench.result }}
          PROPERTIES: ${{ needs.properties.result }}
          SEED: ${{ needs.properties.outputs.seed }}
          REPRO: ${{ needs.properties.outputs.repro }}
        run: |
          label=nightly-failure
          gh label create "$label" --color B60205 \
            --description "A nightly run failed (nightly.yml)" 2>/dev/null || true
          title="Nightly run failed"
          if [[ "$REF" != main ]]; then title="$title (branch $REF)"; fi
          # A job that hits timeout-minutes ends `cancelled`, like a manual cancel.
          result() { if [[ "$1" == cancelled ]]; then echo "timed out or cancelled"; else echo "$1"; fi; }
          {
            echo "$title: $RUN_URL"
            echo
            echo "Trigger \`$EVENT\` on \`$REF\` @ \`${SHA:0:8}\`."
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Main changed in 24 h? | $(result "$CHANGED") |"
            echo "| Stryker (src/engine) | $(result "$MUTATION") |"
            echo "| Engine bench budgets | $(result "$BENCH") |"
            echo "| Property tests (2000 runs) | $(result "$PROPERTIES") |"
            if [[ "$PROPERTIES" == failure || "$PROPERTIES" == cancelled ]]; then
              echo
              if [[ -n "$SEED" ]]; then
                echo "Property seed \`$SEED\`. Reproduce locally:"
                echo
                echo '```sh'
                echo "$REPRO"
                echo '```'
              else
                echo "No property seed was picked (the job failed before it)."
              fi
            fi
          } > body.md
          num=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [[ -n "$num" ]]; then
            gh issue comment "$num" --body-file body.md
          else
            gh issue create --title "$title" --label "$label" --body-file body.md
          fi
