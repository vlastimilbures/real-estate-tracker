name: E2E (nightly, manual)

# Playwright smoke tests against the browser build (in-memory sql.js seed, no real
# database). Optional per ADR 0006 and ADR 0078 decision 3: never required for a merge. They
# run nightly so a break is noticed (#141), and by hand.
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm, Node and dependencies
        uses: ./.github/actions/setup

      # The browser is cached by Playwright version (#496): a hit skips the download and
      # installs only the system libraries, which live outside the cache.
      - name: Read the Playwright version
        id: playwright
        # `playwright --version` prints "Version 1.2.3".
        run: |
          version=$(pnpm exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Playwright smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
