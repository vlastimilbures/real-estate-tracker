# Dependency updates: weekly, grouped so minor/patch bumps arrive as one PR per
# ecosystem. Major bumps stay separate PRs. A runtime dependency change still needs the
# owner's approval (ADR 0002) — review, don't auto-merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node describes one Node major. Its major follows the Node we run, which is
      # pinned by hand (package.json engines ">=24", node-version 24 in
      # .github/actions/setup), not the newest Node release. Raise it with the Node pin.
      # Today it is ^26, ahead of that pin; moving it back to ^24 is tracked in #499.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  # The workflows, and the composite actions they share (.github/actions/setup pins
  # pnpm/action-setup and actions/setup-node; #459).
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
