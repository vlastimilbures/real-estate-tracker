name: Set up pnpm, Node and dependencies
description: >-
  pnpm (version from package.json "packageManager"), Node 24 with the pnpm cache, then
  `pnpm install --frozen-lockfile`. The calling job checks the repository out first.

runs:
  using: composite
  steps:
    # Version comes from package.json "packageManager".
    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
