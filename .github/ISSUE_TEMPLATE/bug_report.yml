name: Bug report
description: Something computes wrong, crashes or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not attach your real database, backups or bank
        statements** — describe the inputs or reproduce the problem with the sample portfolio.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Properties → Byt Lipova
        2. Add a lease starting …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.5"
  - type: textarea
    id: log
    attributes:
      label: Error log excerpt (optional)
      description: "~/Library/Logs/com.bures.realestate-tracker/app.log — remove anything personal."
      render: text
